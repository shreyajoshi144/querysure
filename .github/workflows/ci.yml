name: QuerySure CI

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pip-audit -r requirements.txt   # fail the build on known-vulnerable runtime dependencies

  pytest-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: pytest -q
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./querysure-ci.db
          JWT_SECRET_KEY: ci-test-secret

  pytest-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: querysure
          POSTGRES_PASSWORD: querysure
          POSTGRES_DB: querysure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U querysure -d querysure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          ENVIRONMENT: development
          TEST_DATABASE_URL: postgresql+psycopg2://querysure:querysure@127.0.0.1:5432/querysure
          DATABASE_URL: postgresql+psycopg2://querysure:querysure@127.0.0.1:5432/querysure
          JWT_SECRET_KEY: ci-test-secret

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: querysure
          POSTGRES_PASSWORD: querysure
          POSTGRES_DB: querysure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U querysure -d querysure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg2://querysure:querysure@127.0.0.1:5432/querysure
          JWT_SECRET_KEY: ci-test-secret
      - run: alembic check
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg2://querysure:querysure@127.0.0.1:5432/querysure
          JWT_SECRET_KEY: ci-test-secret

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: [pytest-sqlite, pytest-postgres, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: querysure:ci
      - name: Non-root assertion
        run: test "$(docker run --rm --entrypoint id querysure:ci -u)" = "10001"
      - name: Health and evaluation smoke tests
        run: |
          docker run -d --name querysure-ci \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=sqlite:////app/ci.db \
            -e JWT_SECRET_KEY=ci-test-secret \
            -p 5000:5000 querysure:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/api/evaluation/product-summary
          docker exec querysure-ci test "$(id -u)" = "10001"
          docker rm -f querysure-ci
