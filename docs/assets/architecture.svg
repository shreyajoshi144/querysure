<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5566"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#9aa6b6;stroke-width:1.3}
      .core{fill:#eef3ff;stroke:#1f4fd1;stroke-width:1.6}
      .ai{fill:#fff6e8;stroke:#c98a14;stroke-width:1.4}
      .t{font-size:15px;font-weight:600;fill:#1b2430}
      .s{font-size:12.5px;fill:#5b6675}
      .l{stroke:#4a5566;stroke-width:1.4;fill:none}
      .d{stroke:#8a95a5;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
      .e{font-size:12px;fill:#5b6675}
    </style>
  </defs>
  <rect class="box" x="10" y="95" width="150" height="60" rx="8"/>
  <text class="t" x="85" y="121" text-anchor="middle">Browser</text>
  <text class="s" x="85" y="140" text-anchor="middle">HTML · CSS · JS</text>

  <rect class="core" x="230" y="85" width="200" height="80" rx="8"/>
  <text class="t" x="330" y="114" text-anchor="middle">FastAPI app</text>
  <text class="s" x="330" y="133" text-anchor="middle">auth · query pipeline</text>
  <text class="s" x="330" y="150" text-anchor="middle">quotas · AI budget</text>

  <path class="l" d="M160,125 L228,125" marker-end="url(#a)"/>
  <text class="e" x="194" y="117" text-anchor="middle">HTTPS</text>

  <rect class="ai" x="510" y="8" width="210" height="48" rx="8"/>
  <text class="t" x="615" y="29" text-anchor="middle">LLM providers</text>
  <text class="s" x="615" y="46" text-anchor="middle">Groq → OpenAI → Anthropic</text>

  <rect class="box" x="510" y="68" width="210" height="48" rx="8"/>
  <text class="t" x="615" y="89" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="615" y="106" text-anchor="middle">users · history · usage · AI log</text>

  <rect class="box" x="510" y="128" width="210" height="48" rx="8"/>
  <text class="t" x="615" y="149" text-anchor="middle">S3-compatible storage</text>
  <text class="s" x="615" y="166" text-anchor="middle">uploaded datasets · reports</text>

  <rect class="box" x="510" y="188" width="210" height="48" rx="8"/>
  <text class="t" x="615" y="209" text-anchor="middle">Redis</text>
  <text class="s" x="615" y="226" text-anchor="middle">rate limits · budgets · job queue</text>

  <path class="l" d="M430,110 C470,110 470,32 508,32" marker-end="url(#a)"/>
  <path class="l" d="M430,118 C470,118 470,92 508,92" marker-end="url(#a)"/>
  <path class="l" d="M430,132 C470,132 470,152 508,152" marker-end="url(#a)"/>
  <path class="l" d="M430,140 C470,140 470,212 508,212" marker-end="url(#a)"/>

  <rect class="box" x="770" y="128" width="120" height="108" rx="8"/>
  <text class="t" x="830" y="160" text-anchor="middle">RQ worker</text>
  <text class="s" x="830" y="180" text-anchor="middle">ingestion</text>
  <text class="s" x="830" y="197" text-anchor="middle">reports</text>
  <text class="s" x="830" y="214" text-anchor="middle">email</text>
  <path class="l" d="M720,212 L768,212" marker-end="url(#a)"/>
  <path class="d" d="M770,150 L722,150" marker-end="url(#a)"/>
  <path class="d" d="M800,128 C800,92 760,92 722,92" marker-end="url(#a)"/>
</svg>
