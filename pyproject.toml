[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# deepeval's pytest plugin loads ./.env into the process at startup, which leaks a developer's real provider keys
# and models into the suite. The adapter tests import deepeval directly; the plugin itself is not used.
addopts = "-p no:deepeval"
